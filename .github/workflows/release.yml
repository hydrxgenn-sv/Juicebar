# Builds the four Juicebar packages on real Windows, Linux and macOS machines.
# Pushing a tag like v2.1.0 also creates a GitHub release with them (the app's update check reads it).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: ./publish.ps1 -Targets ${{ matrix.rid }} -Version "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Juicebar-${{ matrix.rid }}
          path: |
            dist/Juicebar-${{ matrix.rid }}.zip
            dist/Juicebar-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
