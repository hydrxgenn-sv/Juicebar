# Builds the four Juicebar packages on real Windows, Linux and macOS machines.
# Pushing a tag like v2.2.1 also creates a GitHub release with them (the app's update check reads it).
#
# Hardening: third-party actions are pinned to exact commits (tags can be moved), the token is
# read-only except in the release job, and every package ships with a SHA-256 checksum and a
# signed build-provenance attestation that anyone can verify.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: ./publish.ps1 -Targets ${{ matrix.rid }} -Version "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/* -Include *.zip, *.tar.gz | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii "dist/SHA256-${{ matrix.rid }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Juicebar-${{ matrix.rid }}
          path: |
            dist/Juicebar-${{ matrix.rid }}.zip
            dist/Juicebar-${{ matrix.rid }}.tar.gz
            dist/SHA256-${{ matrix.rid }}.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: Combine checksums
        run: |
          cat packages/SHA256-*.txt > packages/SHA256SUMS.txt
          rm packages/SHA256-*.txt
          cat packages/SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        continue-on-error: true   # attestations need a public repository (or GitHub Enterprise)
        with:
          subject-path: 'packages/Juicebar-*'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: packages/*
          generate_release_notes: true
